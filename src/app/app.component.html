<div class="app-shell">
  <!-- 顶部用户栏 -->
  <!-- /wizard 与 /auth、/share 使用各自的顶部栏，避免出现两条 sticky 顶栏 -->
  <header
    class="app-header"
    *ngIf="router.url !== '/auth' && !router.url.startsWith('/share/') && !router.url.startsWith('/wizard')"
  >
    <div class="header-left">
      <span class="brand" (click)="router.navigate(['/'])">✈️ 呼呼去哪儿</span>
    </div>
    <div class="header-right">
      <ng-container *ngIf="auth.currentUser$ | async as user; else loginTpl">
        <button pButton type="button" class="p-button-text header-btn-text" (click)="goProfile()">我的方案</button>
        <!-- 用户 chip：p-avatar + 文本 -->
        <button pButton type="button" class="p-button-text user-chip-p" (click)="goProfile()" title="进入个人中心">
          <p-avatar [label]="userInitial(user)" styleClass="avatar-mini-p"></p-avatar>
          <span class="user-name-p">{{ userLabel(user) }}</span>
        </button>
        <button pButton type="button" class="p-button-text header-btn-text" (click)="doLogout()">
          <span class="pi pi-sign-out"></span>
        </button>
      </ng-container>
      <ng-template #loginTpl>
        <button pButton type="button" class="p-button-primary header-login-btn" (click)="goAuth()">登录 / 注册</button>
      </ng-template>
    </div>
  </header>

  <!-- 顶部更新提示：仅在结果页已有内容、正在重新生成时出现，避免与页面内加载并存 -->
  <div class="gen-banner" *ngIf="isGenerating && hasRecommendation && router.url === '/result'">
    <p-progressSpinner styleClass="gen-spinner-p"></p-progressSpinner>
    <span>AI 正在更新攻略…</span>
  </div>

  <router-outlet></router-outlet>
</div>
