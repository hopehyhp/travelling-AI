<div class="app-shell">
  <!-- 顶部用户栏 -->
  <header class="app-header" *ngIf="router.url !== '/auth' && !router.url.startsWith('/share/')">
    <div class="header-left">
      <span class="brand" (click)="router.navigate(['/'])">✈️ Travelling AI</span>
    </div>
    <div class="header-right">
      <ng-container *ngIf="auth.currentUser$ | async as user; else loginTpl">
        <button class="header-btn link" (click)="goProfile()">我的方案</button>
        <button class="user-chip" (click)="goProfile()" title="进入个人中心">
          <span class="avatar-mini">{{ userInitial(user) }}</span>
          <span class="user-name">{{ userLabel(user) }}</span>
        </button>
        <button class="header-btn" (click)="doLogout()">退出</button>
      </ng-container>
      <ng-template #loginTpl>
        <button class="header-btn primary" (click)="goAuth()">登录 / 注册</button>
      </ng-template>
    </div>
  </header>

  <!-- 顶部 generating overlay：在结果页重新生成时显示 -->
  <div class="gen-banner" *ngIf="isGenerating && router.url === '/result'">
    <span class="gen-spinner"></span> AI 正在更新攻略…
  </div>

  <router-outlet></router-outlet>
</div>
