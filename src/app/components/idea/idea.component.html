<section class="idea-screen">
  <div class="idea-wrap">
    <button pButton type="button" class="p-button-text back-link-btn" (click)="onBack()">
      <span class="pi pi-arrow-left"></span> 返回首页
    </button>

    <p-card class="idea-card-p">
      <p class="idea-kicker">我有旅行想法</p>
      <h2 class="idea-title">告诉我们你想去哪里、想怎么玩</h2>
      <p class="idea-hint">未填写的行程条件将按 3 天、2 人、情侣同行和 ¥5000 规划。</p>

      <label class="idea-label" for="travel-idea-input">描述你的旅行想法</label>
      <textarea
        pInputTextarea
        id="travel-idea-input"
        [(ngModel)]="ideaDraft"
        class="idea-input-p"
        rows="6"
        maxlength="500"
        placeholder="例如：我想去三亚度假，想看亚龙湾和蜈支洲岛，想吃海鲜、放松海边散步。"
      ></textarea>

      <div class="idea-meta">
        <span>{{ ideaDraft.length }}/500</span>
        <p-messages *ngIf="ideaError" [value]="[{ severity: 'error', detail: ideaError }]" styleClass="idea-error-p"></p-messages>
      </div>

      <button pButton type="button" class="p-button-primary idea-submit-p" (click)="onSubmit()">
        开始生成攻略
        <span class="pi pi-arrow-right" style="margin-left: 8px;"></span>
      </button>
    </p-card>
  </div>
</section>
